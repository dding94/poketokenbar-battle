name: CI

# Public since 2026-10-29, so standard runners are free. Pushes to feat/** and pull requests run the
# app jobs, plus determinism when the engine boundary or this file changed (see `changes`); a dispatch
# picks the scope. Push and PR events have no inputs, hence the `inputs.<name> || <default>` fallbacks.
on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: app
        options: [app, engine, engine-contract]
      macos:
        description: Engine runner selection
        type: choice
        default: both
        options: [both, macos-15, macos-26]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs in two shards on parallel runners. `rendering` runs the slowest rendering classes
  # (RENDERING_TESTS) and the identity guard; `rest` skips exactly that regex and runs everything else
  # under the coverage gate. test-union checks that the shards ran every listed test once between them.
  build-test:
    if: ${{ (inputs.scope || 'app') == 'app' }}
    name: build-test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [rendering, rest]
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 15). Its Swift 6.1 is also the strictest compiler we
    # build with, so isolation errors that newer Swift accepts still fail here.
    runs-on: macos-15
    # About 1.5x the slower shard (451 s, 2026-10-30). Runners vary up to ~1.6x on the same commit.
    # A job that runs out shows as "cancelled", like a newer run on the same ref would; recheck this
    # budget when a suite is added.
    timeout-minutes: 12
    env:
      # About 210 s of the 480 s suite on 2026-10-30 (SnapshotHistory ~175 s, DexBack ~35 s). They
      # leave the coverage gate; PracticeScreenRenderingTests stays in `rest` for the practice files.
      RENDERING_TESTS: "SnapshotHistoryRenderingTests|DexBackNavigationTests"
    steps:
      - uses: actions/checkout@v5

      - name: Isolate test state and render output
        run: |
          printf 'PTB_STATE_DIR=%s/ptb-battle-ci-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PTB_SNAPSHOT_SCREENSHOT_DIR=%s/snapshot-history-renders\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/test-logs"

      - name: Show Swift version
        run: swift --version

      # check-test-filter.sh fails the step when an alternative ran no test (a renamed class would
      # otherwise drop out silently). An unset `shell` has no pipefail, so it is set here.
      - name: Rendering tests
        if: matrix.shard == 'rendering'
        run: |
          set -o pipefail
          swift test --filter "$RENDERING_TESTS" 2>&1 | tee "$RUNNER_TEMP/test-logs/rendering.log"
          ./scripts/check-test-filter.sh "$RENDERING_TESTS" "$RUNNER_TEMP/test-logs/rendering.log"

      # test-gate.sh runs `swift test --enable-code-coverage` with these arguments and then enforces a
      # line-coverage floor on the logic-core files, so a coverage regression fails the build.
      - name: Test + coverage gate
        if: matrix.shard == 'rest'
        run: |
          set -o pipefail
          ./scripts/test-gate.sh --skip "$RENDERING_TESTS" 2>&1 | tee "$RUNNER_TEMP/test-logs/rest.log"
          ./scripts/battle-coverage.sh

      # The suite as built, for test-union; also after a failure, so test-union still compares.
      - name: List every test
        if: ${{ !cancelled() && matrix.shard == 'rendering' }}
        run: swift test list --skip-build > "$RUNNER_TEMP/test-logs/all-tests.txt"

      - name: Prove the fork identity guard rejects an upstream value
        if: matrix.shard == 'rendering'
        run: bash scripts/test-fork-identity-guard.sh

      - name: Keep the test logs for test-union
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-logs
          retention-days: 1

      - name: Preserve native snapshot-history renders
        if: ${{ always() && matrix.shard == 'rendering' }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-history-renders
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 1

  # Fails unless the build-test shards between them ran every test `swift test list` reports, each
  # exactly once (scripts/check-test-union.sh).
  test-union:
    needs: build-test
    if: ${{ !cancelled() && (inputs.scope || 'app') == 'app' }}
    name: test-union
    runs-on: ubuntu-latest
    # Seconds of work (a checkout, an artifact download, two sorts); 3 minutes like secret-scan.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: test-logs-*
          path: ${{ runner.temp }}/test-logs
          merge-multiple: true
      - name: Every test ran exactly once
        run: |
          ./scripts/check-test-union.sh "$RUNNER_TEMP/test-logs/all-tests.txt" \
            "$RUNNER_TEMP/test-logs/rendering.log" "$RUNNER_TEMP/test-logs/rest.log"

  secret-scan:
    if: ${{ (inputs.scope || 'app') == 'app' }}
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push and PR runs start determinism only when the engine boundary or this file changed (an edit to
  # the determinism job, such as its FILTER, has to run it): a PR against its base, a push against the
  # newest green push run it builds on (scripts/changed-since-green.sh says why).
  changes:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: changes
    runs-on: ubuntu-latest
    # Seconds of work (a full-history checkout, one API call, one diff); 3 minutes like secret-scan.
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.engine.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Quoted so the shell does not expand the globs against the checkout: git matches them, which
      # also catches a deleted or renamed file.
      - name: Engine boundary changed
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/changed-since-green.sh engine Package.swift .github/workflows/ci.yml \
            'Sources/PokeTokenBar/Core/Battle*.swift' 'Sources/PokeTokenBar/Core/Practice*.swift'

  determinism:
    needs: changes
    # A dispatch skips `changes` and picks the scope itself; !cancelled() keeps that skipped need from
    # skipping this job too.
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.scope != 'app') || needs.changes.outputs.engine == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.macos || 'both') == 'both' && fromJSON('["macos-15","macos-26"]') || fromJSON(format('["{0}"]', inputs.macos)) }}
    runs-on: ${{ matrix.os }}
    # About 1.5x the slowest green run (566 s on macos-15, 2026-10-30; the corpus alone took 186 s).
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Isolate test state
        run: echo "PTB_STATE_DIR=$RUNNER_TEMP/ptb-engine-state" >> "$GITHUB_ENV"
      - name: Swift JavaScriptCore boundary
        env:
          FILTER: "BattleEngineTests|BattleSnapshotTests|PracticeBattleTests|PracticeSessionTests|PracticePlaybackTests|PracticeHintsTests|PracticeWild|PracticeRecord|PracticeDaily|PracticeTemperament|PracticeStakes|PracticeWordingTests|PracticeScreenRenderingTests|LocalizedUILiteralTests|ScrollerLaneTests"
        run: |
          set -o pipefail
          swift test --enable-code-coverage --filter "$FILTER" 2>&1 | tee "$RUNNER_TEMP/jsc-boundary.log"
          ./scripts/check-test-filter.sh "$FILTER" "$RUNNER_TEMP/jsc-boundary.log"
          ./scripts/battle-coverage.sh
      - name: Install pinned dependencies
        if: ${{ (inputs.scope || 'engine') == 'engine' }}
        working-directory: engine
        run: npm ci --ignore-scripts
      - name: Engine contracts and deterministic corpus
        if: ${{ (inputs.scope || 'engine') == 'engine' }}
        working-directory: engine
        run: npm test && npm run corpus && npm run compatibility
