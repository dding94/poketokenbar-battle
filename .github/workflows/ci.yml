name: CI

# Public since 2026-10-29, so standard runners are free. Pushes to feat/** and pull requests run the
# app jobs, plus determinism when the engine boundary changed (see `changes`); a dispatch picks the
# scope. Push and PR events have no inputs, hence the `inputs.<name> || <default>` fallbacks.
on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: app
        options: [app, engine, engine-contract]
      macos:
        description: Engine runner selection
        type: choice
        default: both
        options: [both, macos-14, macos-15]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: ${{ (inputs.scope || 'app') == 'app' }}
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    # About 1.5x the slowest green run (770 s, 2026-10-29). Runners vary up to ~1.6x on the same commit.
    # A job that runs out shows as "cancelled", like a newer run on the same ref would; recheck this
    # budget when a suite is added.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Isolate test state and render output
        run: |
          printf 'PTB_STATE_DIR=%s/ptb-battle-ci-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PTB_SNAPSHOT_SCREENSHOT_DIR=%s/snapshot-history-renders\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Show Swift version
        run: swift --version

      # check-test-filter.sh fails the step when an alternative ran no test (a renamed class would
      # otherwise drop out silently). An unset `shell` has no pipefail, so it is set here.
      - name: Fork isolation tests
        env:
          FILTER: "AppIdentityTests|SupportMailTests|UpdateCheckerTests|BattleEngineTests|BattleSnapshotTests|PracticeBattleTests|PracticeSessionTests|PracticePlaybackTests|PracticeHintsTests|PracticeWild|PracticeReadOnlyGuardTests|PracticeWordingTests|PracticeScreenRenderingTests|PracticeLaunchTests|PopoverNavigationTests|LocalizedUILiteralTests|ScrollerLaneTests|SwiftUIIsolationTests|LocalizationColumnTests|LocalizationInterpolationTests"
        run: |
          set -o pipefail
          swift test --filter "$FILTER" 2>&1 | tee "$RUNNER_TEMP/fork-isolation.log"
          ./scripts/check-test-filter.sh "$FILTER" "$RUNNER_TEMP/fork-isolation.log"

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        run: |
          ./scripts/test-gate.sh
          ./scripts/battle-coverage.sh

      - name: Prove the fork identity guard rejects an upstream value
        run: bash scripts/test-fork-identity-guard.sh

      - name: Preserve native snapshot-history renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-history-renders
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 1

  secret-scan:
    if: ${{ (inputs.scope || 'app') == 'app' }}
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push and PR runs start determinism only when the engine boundary changed: a PR against its base,
  # a push against the newest green push run it builds on (scripts/changed-since-green.sh says why).
  changes:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: changes
    runs-on: ubuntu-latest
    # Seconds of work (a full-history checkout, one API call, one diff); 3 minutes like secret-scan.
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.engine.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Quoted so the shell does not expand the globs against the checkout: git matches them, which
      # also catches a deleted or renamed file.
      - name: Engine boundary changed
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./scripts/changed-since-green.sh engine Package.swift \
            'Sources/PokeTokenBar/Core/Battle*.swift' 'Sources/PokeTokenBar/Core/Practice*.swift'

  determinism:
    needs: changes
    # A dispatch skips `changes` and picks the scope itself; !cancelled() keeps that skipped need from
    # skipping this job too.
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.scope != 'app') || needs.changes.outputs.engine == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.macos || 'both') == 'both' && fromJSON('["macos-14","macos-15"]') || fromJSON(format('["{0}"]', inputs.macos)) }}
    runs-on: ${{ matrix.os }}
    # About 1.5x the slowest run: the Swift boundary took 215 s and the corpus over 170 s on 2026-10-29.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Isolate test state
        run: echo "PTB_STATE_DIR=$RUNNER_TEMP/ptb-engine-state" >> "$GITHUB_ENV"
      - name: Select Swift 6 on macOS 14
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Swift JavaScriptCore boundary
        env:
          FILTER: "BattleEngineTests|BattleSnapshotTests|PracticeBattleTests|PracticeSessionTests|PracticePlaybackTests|PracticeHintsTests|PracticeWild|PracticeWordingTests|PracticeScreenRenderingTests|LocalizedUILiteralTests|ScrollerLaneTests"
        run: |
          set -o pipefail
          swift test --enable-code-coverage --filter "$FILTER" 2>&1 | tee "$RUNNER_TEMP/jsc-boundary.log"
          ./scripts/check-test-filter.sh "$FILTER" "$RUNNER_TEMP/jsc-boundary.log"
          ./scripts/battle-coverage.sh
      - name: Install pinned dependencies
        if: ${{ (inputs.scope || 'engine') == 'engine' }}
        working-directory: engine
        run: npm ci --ignore-scripts
      - name: Engine contracts and deterministic corpus
        if: ${{ (inputs.scope || 'engine') == 'engine' }}
        working-directory: engine
        run: npm test && npm run corpus && npm run compatibility
