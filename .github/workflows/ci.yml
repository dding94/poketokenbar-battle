name: CI

# Private project bootstrap: enable automatic runs only after reviewing Actions usage.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: app
        options: [app, engine, engine-contract]
      macos:
        description: Engine runner selection
        type: choice
        default: both
        options: [both, macos-14, macos-15]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: ${{ inputs.scope == 'app' }}
    name: build-test
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version: 6.0, platform macOS 14).
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Isolate test state and render output
        run: |
          printf 'PTB_STATE_DIR=%s/ptb-battle-ci-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PTB_SNAPSHOT_SCREENSHOT_DIR=%s/snapshot-history-renders\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Show Swift version
        run: swift --version

      - name: Fork isolation tests
        run: swift test --filter "AppIdentityTests|SupportMailTests|UpdateCheckerTests|BattleEngineTests|BattleSnapshotTests|PracticeBattleTests|PracticeSessionTests|PracticeScreenRenderingTests|PracticeLaunchTests|PopoverNavigationTests|LocalizedUILiteralTests|ScrollerLaneTests|SwiftUIIsolationTests|LocalizationColumnTests|LocalizationInterpolationTests"

      # test-gate.sh runs `swift test --enable-code-coverage` and then enforces a
      # line-coverage floor on the logic-core files. It replaces a bare `swift test`:
      # the tests still run, and a coverage regression now fails the build.
      - name: Test + coverage gate
        run: |
          ./scripts/test-gate.sh
          ./scripts/battle-coverage.sh

      - name: Prove the fork identity guard rejects an upstream value
        run: bash scripts/test-fork-identity-guard.sh

      - name: Preserve native snapshot-history renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-history-renders
          path: ${{ runner.temp }}/snapshot-history-renders
          if-no-files-found: ignore
          retention-days: 1

  secret-scan:
    if: ${{ inputs.scope == 'app' }}
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can diff the whole PR commit range.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  determinism:
    if: ${{ inputs.scope != 'app' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos == 'both' && fromJSON('["macos-14","macos-15"]') || fromJSON(format('["{0}"]', inputs.macos)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Isolate test state
        run: echo "PTB_STATE_DIR=$RUNNER_TEMP/ptb-engine-state" >> "$GITHUB_ENV"
      - name: Select Swift 6 on macOS 14
        if: matrix.os == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Swift JavaScriptCore boundary
        run: |
          swift test --enable-code-coverage --filter "BattleEngineTests|BattleSnapshotTests|PracticeBattleTests|PracticeSessionTests|PracticeScreenRenderingTests|LocalizedUILiteralTests|ScrollerLaneTests"
          ./scripts/battle-coverage.sh
      - name: Install pinned dependencies
        if: ${{ inputs.scope == 'engine' }}
        working-directory: engine
        run: npm ci --ignore-scripts
      - name: Engine contracts and deterministic corpus
        if: ${{ inputs.scope == 'engine' }}
        working-directory: engine
        run: npm test && npm run corpus && npm run compatibility
